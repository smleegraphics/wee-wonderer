# The scan host: a Worker that serves the example scans from an R2 bucket at a
# workers.dev address (context/deploy.md). Deploy: npm run deploy --prefix deploy/scans-worker
name = "wee-scans"
main = "index.js"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "SCANS"
bucket_name = "wee-scans"

[vars]
# The pages allowed to fetch scans (comma-separated; `*` matches one run of letters, digits
# and hyphens, never a dot: see context/deploy.md). Anything else gets no CORS header,
# so the browser refuses the response and the app shows its scan-load error.
ALLOWED_ORIGINS = "https://wee.samanthamlee.com"
